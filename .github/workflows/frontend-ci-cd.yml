name: Frontend CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FRONTEND_IMAGE: ghcr.io/thaihoangmt4/language-learning-frontend

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production application
        run: npm run build

  build-image:
    name: Build and publish ARM64 image
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate public build configuration
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ASSETS_HOSTNAME: ${{ vars.NEXT_PUBLIC_ASSETS_HOSTNAME }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          test -n "$NEXT_PUBLIC_ASSETS_HOSTNAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ASSETS_HOSTNAME=${{ vars.NEXT_PUBLIC_ASSETS_HOSTNAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production EC2
    needs: build-image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/frontend-production"
          chmod 600 "$HOME/.ssh/frontend-production"

          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy production Compose file
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/frontend-production" \
            docker-compose.prod.yml \
            "${EC2_USER}@${EC2_HOST}:/opt/language-learning-frontend/docker-compose.prod.yml"

      - name: Deploy current SHA and verify frontend
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/frontend-production" "${EC2_USER}@${EC2_HOST}" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          readonly deployment_dir=/opt/language-learning-frontend
          readonly frontend_image_tag="$1"

          cd "$deployment_dir"
          test -f docker-compose.prod.yml
          test -f .env

          if grep -q '^FRONTEND_IMAGE_TAG=' .env; then
            sed -i "s|^FRONTEND_IMAGE_TAG=.*$|FRONTEND_IMAGE_TAG=${frontend_image_tag}|" .env
          else
            printf '\nFRONTEND_IMAGE_TAG=%s\n' "$frontend_image_tag" >> .env
          fi

          docker compose -f docker-compose.prod.yml --env-file .env pull frontend
          docker compose -f docker-compose.prod.yml --env-file .env up -d frontend

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi
            echo "Frontend is not reachable yet (attempt ${attempt}/30)."
            sleep 5
          done

          echo "Frontend health check failed after 30 attempts." >&2
          docker compose -f docker-compose.prod.yml --env-file .env ps >&2
          docker compose -f docker-compose.prod.yml --env-file .env logs --tail=100 frontend >&2
          exit 1
          REMOTE
